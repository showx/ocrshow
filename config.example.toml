# ocrshow 配置模板（可提交到 GitHub）
#
# 使用：复制为 config.toml 后按本机修改。
#   Windows:  copy config.example.toml config.toml
#   Linux:    cp config.example.toml config.toml
#
# 分层：代码默认 → 本文件 → config.toml → .env / 环境变量 → 命令行参数
# config.toml、.env、samples/ 里的截图都不会进 git。

device = "auto"          # auto | gpu | cpu
addr = ":8080"           # Web 后端监听地址

[paths]
# 命令行未指定图片时扫描这个目录。请把真实截图放这里，不要提交。
images = "samples"
output = "output"
data = "data"

[vl]
skip = false
host = "http://127.0.0.1:11434"
model = "qwen3-vl:8b"
timeout = 600
# 云端 VL 的密钥请写在 .env 的 OCR_VL_API_KEY，不要写在这个文件里。

# 界面类别来自 sheets/**/*.toml，不必写在这里。
# 开源默认：自动识别 + 通用表格。
# 公司内部版式：把 .py 和同名 .toml 丢进 sheets/private/（该目录不入库）。
# 如需只改某个模块的展示名，可取消注释覆盖：
# [[categories]]
# id = "generic"
# name = "通用表格"
# desc = "按识别框导出文本"
